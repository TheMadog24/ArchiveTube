<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ArchiveTube - Twitch Tracker{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block head %}{% endblock %}
</head>

<body>

    <div class="app-container">

        <!-- Global Header -->

        <header class="site-header">

            <div class="header-main">

                <a href="/" class="logo">
                    <span class="logo-name">ArchiveTube</span>
                    <span class="logo-section">Twitch Tracker</span>
                </a>

                <div class="header-actions">

                    <button class="header-button" type="button" title="Search">
                        <span>Search</span>
                        <span class="button-icon">⌕</span>
                    </button>

                    <button class="header-button" type="button" title="Settings">
                        <span>Settings</span>
                        <span class="button-icon">⚙</span>
                    </button>

                    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"
                        title="Toggle theme">
                        <span class="button-icon theme-icon">☾</span>
                        <span class="theme-label">Light Mode</span>
                    </button>

                    <button class="user-button" type="button" title="User Account">
                        <span class="user-icon">👤</span>
                        <span>Login</span>
                    </button>

                </div>

            </div>

            <!-- Main Navigation -->

            <nav class="main-navigation">

                <div class="sidebar-toggle-container">
                    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle sidebar"
                        title="Toggle sidebar">
                        ☰
                    </button>
                </div>

                <div class="main-nav-links">

                    <a href="/" class="main-nav-item {% if active_page == 'home' %}active{% endif %}">Home</a>
                    <a href="/dashboard"
                        class="main-nav-item {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
                    <a href="/channels"
                        class="main-nav-item {% if active_page == 'channels' %}active{% endif %}">Channels</a>
                    <a href="#" class="main-nav-item">Live Streams</a>
                    <a href="#" class="main-nav-item">Videos</a>
                    <a href="#" class="main-nav-item">Statistics</a>

                </div>

                <div class="platform-switch">
                    <span class="platform-label">Switch to</span>

                    <a href="#" class="switch-button">
                        YouTube ↗
                    </a>
                </div>

            </nav>

        </header>


        <!-- Page Layout -->

        <div class="page-container">

            <!-- Sidebar -->

            <aside class="sidebar">

                {% block sidebar %}{% endblock %}

            </aside>


            <!-- Main Content -->

            <main class="main-content">

                {% block content %}{% endblock %}

            </main>

        </div>

    </div>


    <!-- Shared Scripts -->

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

    {% block scripts %}{% endblock %}

</body>

</html>
